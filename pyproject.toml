[project]
name = "stock-news"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "openai>=3.7.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "resend>=2.42.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
digest = "digest.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "digest"]
